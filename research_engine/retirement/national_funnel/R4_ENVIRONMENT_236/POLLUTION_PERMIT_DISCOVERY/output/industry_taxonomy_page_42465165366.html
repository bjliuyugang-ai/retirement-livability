function add(){
	var hytype = 'more';
	var treeobj = $.fn.zTree.getZTreeObj("tree");
	var checkedNodes = treeobj.getCheckedNodes(true);
	var hyid="";
	var hynamehyids="";
	var singlehyname="";//单独的行业名称
	if(checkedNodes!=null&&checkedNodes!=""){
		
		for(var index in checkedNodes){
			if(hyid==""){
				hyid=checkedNodes[index].id;
			}else{
				hyid+=","+checkedNodes[index].id;
			}
			
			if(singlehyname==""){
				hynamehyids=checkedNodes[index].name;
				singlehyname=checkedNodes[index].singlehyname;
			}else{
				hynamehyids+=","+checkedNodes[index].name;
				singlehyname+=","+checkedNodes[index].singlehyname;
			}
			
		}
		//其他行业选择后显示名字中不用带编码，所以将singlehyname传过去
		art.dialog.open.origin.addHyid(hyid,hynamehyids,singlehyname,hytype);
	}else{
		return false;
	}
	art.dialog.close();
}
