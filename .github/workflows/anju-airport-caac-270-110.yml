name: "Anju 110-area airport access from CAAC 270 master"
on:
  push:
    branches: [anju-production-pharmacy-20261125]
    paths:
      - '.github/workflows/anju-airport-caac-270-110.yml'
  workflow_dispatch:
jobs:
  airport-access-110:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY || secrets.AMAP_WEB_KEY || secrets.AMAP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Parse CAAC 270-airport directory and calculate nearest airport routes for 110 areas
        shell: bash
        run: |
          set -eu
          python -m py_compile anju/scripts/airport_access_caac_270_110.py
          python anju/scripts/airport_access_caac_270_110.py
      - name: Commit airport master and 110-area matrix
        if: success()
        shell: bash
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anju/results/airport_access_110/airport_master_270.json anju/results/airport_access_110/latest.csv anju/results/airport_access_110/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Produce 110-area airport access matrix from CAAC directory'
            git push origin HEAD:anju-production-pharmacy-20261125
          fi
      - name: Upload airport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anju-110-airport-access-caac-270
          path: |
            anju/results/airport_access_110/airport_master_270.json
            anju/results/airport_access_110/latest.csv
            anju/results/airport_access_110/latest.json
          retention-days: 30
