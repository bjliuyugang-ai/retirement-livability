name: Retirement nationwide R3 historic county DEM altitude cascade
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-national-r3-dem.yml'
jobs:
  r3-altitude:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: retirement-phase1-state-single-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: S0-S2 read current state unique R3 after R2 verified
        run: python research_engine/retirement/national_r3_state.py precheck
      - name: S3 score terrain sample height ranges with no automatic whole-county exclusion
        run: |
          python -m py_compile research_engine/retirement/national_r3_dem_batch.py research_engine/retirement/national_r3_state.py
          python -u research_engine/retirement/national_r3_dem_batch.py
      - name: S4-S5 archive actual DEM QA and complete 2847-row R3 list
        id: finalize
        run: python research_engine/retirement/national_r3_state.py finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nationwide-R3-36-DEM-points-12-counties-2847-register
          path: |
            research_engine/retirement/output/national_r3_first_real_batch*
          retention-days: 30
      - name: Persist historic R3 terrain data and fail closed on race
        if: steps.finalize.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_LOG.jsonl research_assets/retirement/CURRENT_STATE.md research_engine/retirement/status/national_r3_first_real_batch_evidence.json research_engine/retirement/status/national_r3_first_real_batch.csv
          git commit -m "Publish R3 36 real DEM samples and 2847 unknown-retained county ledger"
          git fetch origin main
          python - <<'PY'
          import json,subprocess
          p=json.load(open("research_engine/retirement/output/national_r3_precheck.json"))
          s=json.loads(subprocess.check_output(["git","show","origin/main:tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json"]))
          assert s["state_revision"]==p["source_rev"],"R3_CAS_STATE_CHANGED"
          assert s["current_state_ref"]["git_blob_sha"]==p["source_current_blob"],"R3_CAS_CURRENT_DRIFT"
          PY
          git rebase origin/main
          git push origin HEAD:main
      - name: S6 verify remote evidence SHA and R4 handoff
        if: steps.finalize.outcome == 'success'
        run: |
          git fetch origin main
          python research_engine/retirement/national_r3_state.py postcheck
          git add tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_LOG.jsonl
          git commit -m "Verify V1.6 R3 DEM source and R4 next action"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 2
          done
          git fetch origin main
          python - <<'PY'
          import json,subprocess
          s=json.loads(subprocess.check_output(["git","show","origin/main:tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json"]))
          assert s["writeback_verification"]["status"]=="POSTCHECK_PASS"
          assert s["active_action"]["action_id"]=="RET-CASCADE-NATIONAL-R4-001"
          assert s["national_parameter_rounds"]["R3"]["DEM_total_samples"]==36
          print("R3_S6_PASS",s["national_parameter_rounds"]["R3"])
          PY
