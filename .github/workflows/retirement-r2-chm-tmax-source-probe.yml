name: Retirement R2 CHM Tmax v2 source probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-r2-chm-tmax-source-probe.yml'
      - 'research_engine/retirement/national_funnel/R2_SOURCE_PROBE/CHM_TMAX/probe_chm_tmax_v2.py'
  workflow_dispatch:

jobs:
  chm-tmax-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: retirement-r2-chm-tmax-source-probe
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NetCDF reader
        run: python -m pip install --disable-pip-version-check numpy netCDF4
      - name: Probe and download one decade file
        run: python -u research_engine/retirement/national_funnel/R2_SOURCE_PROBE/CHM_TMAX/probe_chm_tmax_v2.py
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-r2-chm-tmax-source-probe
          path: research_engine/retirement/national_funnel/R2_SOURCE_PROBE/CHM_TMAX/output/
          retention-days: 30
          if-no-files-found: warn
      - name: Persist probe evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research_engine/retirement/national_funnel/R2_SOURCE_PROBE/CHM_TMAX/output
          if ! git diff --cached --quiet; then
            git commit -m "Record CHM Tmax v2 daily climate source probe"
            for i in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$i" = 3 ]; then exit 1; fi
              sleep 3
            done
          fi
