name: Retirement phase1 historical code match assault
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-adcode-assault.yml'
jobs:
  historical-code-match:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: retirement-phase1-state-single-writer
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      ASSAULT_ACTION: RET-ADCODE-001
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V1.6 state and exploratory safeguards
        run: python retirement-climate-pilot/assault_state.py selftest
      - name: S0-S2 inherit verified spatial result and claim code action
        id: precheck
        run: python retirement-climate-pilot/assault_state.py precheck
      - name: S3 download raw archive and crosscheck bilingual county candidate links
        id: adcode
        continue-on-error: true
        run: python retirement-climate-pilot/adcode_probe.py
      - name: S4-S5 judge evidence, append log and update unique next action
        id: finalize
        if: always() && steps.precheck.outcome == 'success'
        run: python retirement-climate-pilot/assault_state.py finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirement-archival-code-evidence
          path: retirement-climate-pilot/output/
          retention-days: 14
      - name: Commit auditable code-candidate evidence
        if: steps.finalize.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_LOG.jsonl research_assets/retirement/CURRENT_STATE.md retirement-climate-pilot/status/latest-adcode-probe.json
          git diff --cached --quiet && exit 2 || true
          git commit -m "Record archival code crosscheck and pending postcheck"
          git push origin HEAD:main
      - name: S6 remote postcheck, then publish verified state
        if: steps.finalize.outcome == 'success'
        run: |
          git fetch origin main
          python retirement-climate-pilot/assault_state.py postcheck
          git add tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_LOG.jsonl
          git commit -m "Confirm archival code assault remote postcheck"
          git push origin HEAD:main
          git fetch origin main
          python - <<'PY'
          import json,subprocess
          d=json.loads(subprocess.check_output(["git","show","origin/main:tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json"]))
          assert d["writeback_verification"]["status"]=="POSTCHECK_PASS"
          assert d["last_verified_run"]["action_id"]=="RET-ADCODE-001"
          print("POSTCHECK_PASS",d["last_verified_run"])
          PY
      - name: Never mark failed code evidence as success
        if: steps.adcode.outcome == 'failure'
        run: exit 1
