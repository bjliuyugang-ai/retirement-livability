name: Retirement R4 national 236 flood exposure first pass
on:
  push:
    branches: [main]
    paths:
      - 'research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/FLOOD_236/RUN_REQUEST.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flood-236:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: retirement-r4-flood-236
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse WorldPop 2024 raster cache from national climate funnel
        uses: actions/cache/restore@v4
        with:
          path: research_engine/retirement/national_funnel/R1/cache
          key: retirement-national-funnel-r1-inputs-v2-${{ runner.os }}
      - name: Cache World Bank 1km flood source
        uses: actions/cache@v4
        with:
          path: research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/FLOOD_236/cache
          key: retirement-r4-wb-flood-rp100-v1-${{ runner.os }}
      - name: Install geospatial packages
        run: python -m pip install --disable-pip-version-check numpy rasterio shapely
      - name: Calculate World Bank 100-year riverine flood hazard proxies for 236 candidates
        run: python -u research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/FLOOD_236/run_worldbank_flood_236.py
      - name: Verify the complete candidate denominator and no premature exclusions
        run: |
          python - <<'PY'
          import csv,json,pathlib
          out=pathlib.Path("research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/FLOOD_236/output")
          d=json.loads((out/"NATIONAL_236_FLOOD_RP100_SUMMARY.json").read_text(encoding="utf-8"))
          with (out/"NATIONAL_236_FLOOD_RP100_CANDIDATE_SCREEN.csv").open(encoding="utf-8-sig",newline="") as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==236 and len({r["code"] for r in rows})==236
          assert all(r["hard_R4_exclusion"]=="NO" for r in rows)
          assert d["formal_exclusions"]==0 and d["candidate_count_remaining"]==236
          print("FLOOD_SCREEN_236_VALIDATED",d["status_counts"])
          PY
      - name: Upload nationwide flood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-r4-national-flood-236-${{ github.run_id }}
          path: research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/FLOOD_236/output/
          retention-days: 30
          if-no-files-found: warn
      - name: Persist immutable flood evidence run
        if: always()
        run: |
          out=research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/FLOOD_236/output
          if [ ! -f "$out/NATIONAL_236_FLOOD_RP100_SUMMARY.json" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$out/runs/${{ github.run_id }}"
          cp "$out/NATIONAL_236_FLOOD_RP100_SUMMARY.json" "$out/runs/${{ github.run_id }}/"
          cp "$out/NATIONAL_236_FLOOD_RP100_CANDIDATE_SCREEN.csv" "$out/runs/${{ github.run_id }}/"
          git add "$out/runs/${{ github.run_id }}"
          git commit -m "Record nationwide R4 modelled river flood screening for 236 candidates"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 3
          done
