name: Retirement national R4 environmental health screen - current 236 only
on:
  push:
    branches: [main]
    paths:
      - 'research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/run_r4_environment_236.py'
      - 'research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/R4_236_SCOPE_LOCK.json'
  workflow_dispatch:

jobs:
  r4-environment-236:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: retirement-national-r4-environment-236
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout current 236-candidate funnel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore verified R1 geometry and population cache
        uses: actions/cache/restore@v4
        with:
          path: research_engine/retirement/national_funnel/R1/cache
          key: retirement-national-funnel-r1-inputs-v2-Linux

      - name: Cache all R4 source inputs including CHAP, geometry and population grid
        uses: actions/cache@v4
        with:
          path: research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/cache
          key: retirement-r4-236-inputs-v1-${{ runner.os }}

      - name: Install geospatial and NetCDF dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy rasterio shapely netCDF4

      - name: Run R4 environmental health screen on exactly 236 candidates
        run: |
          python -u research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/run_r4_environment_236.py

      - name: Validate the 236-only output and no premature exclusions
        if: always()
        run: |
          python - <<'PY'
          import csv, json, pathlib, sys
          out = pathlib.Path("research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/output")
          p = out / "R4_ENVIRONMENT_236_SUMMARY.json"
          if not p.exists():
              print("R4_SUMMARY_MISSING")
              sys.exit(1)
          d = json.loads(p.read_text(encoding="utf-8"))
          print("INPUT_COUNT", d.get("input_count"))
          print("FUNNEL_SPLIT", json.dumps(d.get("funnel_split"), ensure_ascii=False))
          print("AIR_COMPUTED", d.get("air_grid_computed_count"))
          print("AIR_PENDING", d.get("air_grid_pending_count"))
          print("FORMAL_EXCLUSIONS", d.get("formal_exclusions"))
          if d.get("input_count") != 236 or d.get("formal_exclusions") != 0:
              sys.exit(1)
          f = out / "R4_AIR_236_1KM_2000_2025.csv"
          if not f.exists():
              print("R4_AIR_CSV_MISSING")
              sys.exit(1)
          with f.open(encoding="utf-8-sig", newline="") as h:
              rows = list(csv.DictReader(h))
          if len(rows) != 236 or len({x["code"] for x in rows}) != 236:
              print("R4_AIR_OUTPUT_NOT_236", len(rows))
              sys.exit(1)
          PY

      - name: Upload R4 environmental evidence tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-r4-environment-236-${{ github.run_id }}
          path: research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/output/
          retention-days: 30
          if-no-files-found: warn

      - name: Persist R4 evidence tables and state
        if: always()
        run: |
          if [ ! -d research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/output ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research_engine/retirement/national_funnel/R4_ENVIRONMENT_236/output
          if ! git diff --cached --quiet; then
            git commit -m "Record R4 environmental health evidence for current 236 candidates"
            for i in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$i" = 3 ]; then
                exit 1
              fi
              sleep 4
            done
          fi
