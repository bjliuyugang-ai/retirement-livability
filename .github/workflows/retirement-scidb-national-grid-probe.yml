name: Retirement national 1km climate grid ScienceDB real download and raster QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-scidb-national-grid-probe.yml'
      - 'research_engine/retirement/scidb_national_grid_probe.py'
  workflow_dispatch:
jobs:
  scidb-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: retirement-phase1-state-single-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify current V1.6 active action
        run: |
          python - <<'PY'
          import json
          s=json.load(open("tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json",encoding="utf-8"))
          assert s["active_action"]["action_id"]=="RET-CASCADE-NATIONAL-R1_R2_30YEAR_GRID_SCALE-017"
          assert s["writeback_verification"]["status"]=="POSTCHECK_PASS"
          print("CURRENT_ACTION_GATE_PASS",s["state_revision"],s["active_action"]["action_id"])
          PY
      - name: Install GeoTIFF inspection dependency
        run: python -m pip install --disable-pip-version-check rasterio numpy
      - name: Download actual historical 1km Tmax and sunshine-percent GeoTIFF archives
        id: download
        continue-on-error: true
        run: python -u research_engine/retirement/scidb_national_grid_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scidb-national-1km-historical-raster-download-qa
          path: research_engine/retirement/output/scidb_national_grid_probe.json
          retention-days: 30
      - name: Persist actual download hashes, raster metadata, and failures
        if: always()
        run: |
          mkdir -p research_engine/retirement/status
          if [ -f research_engine/retirement/output/scidb_national_grid_probe.json ]; then
            cp research_engine/retirement/output/scidb_national_grid_probe.json research_engine/retirement/status/scidb_national_grid_probe.json
          else
            printf '{"status":"SCRIPT_DID_NOT_WRITE_OUTPUT","formal_valid_county_screenings":0,"county_exclusions":0}\n' > research_engine/retirement/status/scidb_national_grid_probe.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_engine/retirement/status/scidb_national_grid_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record ScienceDB national 1km historical climate raster download and QA"
            for i in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$i" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Summarize result and preserve no-screening guard
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open("research_engine/retirement/status/scidb_national_grid_probe.json"))
          print("SOURCE_RASTER_STATUS",d.get("status"))
          print("FORMAL_VALID_COUNTY_SCREENINGS",d.get("formal_valid_county_screenings",0))
          print("COUNTY_EXCLUSIONS",d.get("county_exclusions",0))
          for k,v in d.get("files",{}).items():
            print(k,v.get("bytes"),v.get("geotiff_bytes"),v.get("geotiff_member"),v.get("error"))
          PY
