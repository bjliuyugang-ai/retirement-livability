name: "Anju second-stage daily essentials by category 1km 110-area production"
on:
  push:
    branches: [anju-production-pharmacy-20261125]
    paths:
      - 'anju/scripts/daily_essentials_by_category_1km_110.py'
      - '.github/workflows/anju-daily-essentials-by-category-110.yml'
  workflow_dispatch:
jobs:
  daily-essentials-by-category-110:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY || secrets.AMAP_WEB_KEY || secrets.AMAP_KEY }}
      ANJU_MAX_AREAS: "110"
      ANJU_MAX_REQUESTS: "350"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Run separate category queries for all 110 areas
        shell: bash
        run: |
          set -eu
          python -m py_compile anju/scripts/daily_essentials_by_category_1km_110.py
          python anju/scripts/daily_essentials_by_category_1km_110.py
      - name: Preserve aggregate research evidence
        if: success()
        shell: bash
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anju/results/daily_essentials_by_category_1km/latest.csv anju/results/daily_essentials_by_category_1km/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist separate 110-area daily essentials category counts'
            git push origin HEAD:anju-production-pharmacy-20261125
          fi
      - name: Upload aggregate category evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anju-daily-essentials-by-category-1km-110-evidence
          path: |
            anju/results/daily_essentials_by_category_1km/latest.csv
            anju/results/daily_essentials_by_category_1km/latest.json
          retention-days: 30
