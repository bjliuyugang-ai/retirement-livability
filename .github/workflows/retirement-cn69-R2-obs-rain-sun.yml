name: Retirement real 69 CN climate stations independent R2 rain sunshine 1991-2020
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-cn69-R2-obs-rain-sun.yml'
jobs:
  real-station-R2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: retirement-phase1-state-single-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: S0-S2 assert unique source-backed Meteostat R2 active action
        run: |
          python - <<'PY'
          import json,subprocess
          s=json.load(open("tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json"))
          assert s["state_revision"]==45
          assert s["active_action"]["action_id"]=="RET-CASCADE-NATIONAL-METEOSTAT-R2-004"
          assert s["writeback_verification"]["status"]=="POSTCHECK_PASS"
          h=subprocess.check_output(["git","hash-object","research_assets/retirement/CURRENT_STATE.md"],text=True).strip()
          assert s["current_state_ref"]["git_blob_sha"]==h
          print("SOURCE_R2_V16_PREFLIGHT_PASS",s["state_revision"])
          PY
      - uses: actions/cache@v4
        with:
          path: research_engine/retirement/output/meteostat_bulk_runtime
          key: meteostat-station-monthly-2026-11-07-source-snapshot
      - name: Load original Parquet and compute parameter-wise 1991-2020 rain sunshine
        run: |
          python -m pip -q install duckdb
          python -m py_compile research_engine/retirement/meteostat_CN_R2_precip_sun_69.py
          python -u research_engine/retirement/meteostat_CN_R2_precip_sun_69.py
      - name: Check R2 real monthly source coverage, unknowns and nonofficial exclusions
        id: audit
        run: |
          python - <<'PY'
          import csv,hashlib,json
          root="research_engine/retirement/output/"
          d=json.load(open(root+"national_R2_meteostat_station_source_evidence.json"))
          assert d["input_provisional_counties"]==2847
          assert d["coded_location_name_station_count"]==69
          assert d["R2_new_station_partial_counties"]>=1
          assert d["R2_total_partial_site_counties"]==12+d["R2_new_station_partial_counties"]
          assert d["formal_valid_county_screenings"]==0
          assert d["confirmed_exclusions"]==0
          assert d["official_2026_county_roster_verified"] is False
          raw=open(root+"national_R2_meteostat_station_source_2847.csv","rb").read()
          assert hashlib.sha256(raw).hexdigest()==d["CSV_sha256"]
          with open(root+"national_R2_meteostat_station_source_2847.csv",encoding="utf-8-sig") as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==2847
          assert sum(z["R2_status"]!="NOT_SCREENED" for z in rows)==d["R2_total_partial_site_counties"]
          assert all(z["confirmed_exit_round"]=="" for z in rows)
          print("R2_REAL_OBSERVATIONAL_QA_PASS",d["R2_new_station_partial_counties"],d["R2_total_partial_site_counties"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-69-CN-station-observed-1991-2020-rain-sun-2847-county-R2
          path: |
            research_engine/retirement/output/national_R2_meteostat_station_source_evidence.json
            research_engine/retirement/output/national_R2_meteostat_station_source_2847.csv
          retention-days: 30
      - name: Persist R2 evidence and independent remote SHA verification
        if: steps.audit.outcome == 'success'
        run: |
          cp research_engine/retirement/output/national_R2_meteostat_station_source_evidence.json research_engine/retirement/status/national_R2_meteostat_station_source_evidence.json
          cp research_engine/retirement/output/national_R2_meteostat_station_source_2847.csv research_engine/retirement/status/national_R2_meteostat_station_source_2847.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_engine/retirement/status/national_R2_meteostat_station_source_evidence.json research_engine/retirement/status/national_R2_meteostat_station_source_2847.csv
          git commit -m "Record 1991-2020 observed monthly precipitation and sunshine source sufficiency for 69 mapped CN stations and national R2 register"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$i" = 4 ]; then exit 1; fi
            sleep 2
          done
          git fetch origin main
          python - <<'PY'
          import json,hashlib,subprocess
          root="research_engine/retirement/status/"
          d=json.loads(subprocess.check_output(["git","show","origin/main:"+root+"national_R2_meteostat_station_source_evidence.json"]))
          raw=subprocess.check_output(["git","show","origin/main:"+root+"national_R2_meteostat_station_source_2847.csv"])
          assert hashlib.sha256(raw).hexdigest()==d["CSV_sha256"]
          assert d["formal_valid_county_screenings"]==0
          print("R2_OBSERVATION_REMOTE_SHA_PASS",d["R2_new_station_partial_counties"])
          PY
