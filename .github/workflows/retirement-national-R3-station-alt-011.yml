name: Retirement national R3 real 201 weather-station elevations and 36 DEM samples
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-national-R3-station-alt-011.yml'
jobs:
  national-R3-source-elevation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: retirement-phase1-state-single-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V1.6 S0-S2 unique R3 after 73 comparative source data
        run: |
          python - <<'PY'
          import json,subprocess
          s=json.load(open("tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json"))
          assert s["state_revision"]==59
          assert s["active_action"]["action_id"]=="RET-CASCADE-NATIONAL-R3-STATION-ALTITUDE-011"
          assert s["writeback_verification"]["status"]=="POSTCHECK_PASS"
          assert s["current_state_ref"]["git_blob_sha"]==subprocess.check_output(["git","hash-object","research_assets/retirement/CURRENT_STATE.md"],text=True).strip()
          PY
      - name: Compute real weather station altitudes and existing DEM county overlap
        run: |
          python -m py_compile research_engine/retirement/national_R3_station_altitude_011.py
          python -u research_engine/retirement/national_R3_station_altitude_011.py
      - name: QA 201 source station points, 198 county candidates, 12 DEM, 205 total R3
        id: audit
        run: |
          python - <<'PY'
          import csv,hashlib,json
          root="research_engine/retirement/output/"
          d=json.load(open(root+"national_R3_station_elevations_actual_evidence.json"))
          assert d["national_provisional_input"]==2847
          assert d["station_altitude_point_records"]==201
          assert d["station_altitude_distinct_county_candidates"]==198
          assert d["existing_dem_sample_counties"]==12 and d["existing_dem_points"]==36
          assert d["station_and_dem_same_code_counties"]==5
          assert d["distinct_county_candidates_with_ANY_station_or_dem_R3_point_evidence"]==205
          assert d["R3_unknown_no_elevation_points_counties"]==2642
          assert d["actual_residence_altitude_verified"]==0
          assert d["confirmed_exclusions"]==d["formal_valid_county_screenings"]==0
          raw=open(root+"national_R3_201_station_36DEM_2847_missing_and_altitude.csv","rb").read()
          assert hashlib.sha256(raw).hexdigest()==d["national_CSV_sha256"]
          rows=list(csv.DictReader(open(root+"national_R3_201_station_36DEM_2847_missing_and_altitude.csv",encoding="utf-8-sig")))
          assert len(rows)==2847 and len({r["candidate_code"] for r in rows})==2847
          assert sum(r["R3_status"]!="NOT_SCREENED" for r in rows)==205
          assert all(r["confirmed_exit_round"]=="" for r in rows)
          print("R3_STATION_GEOMETRY_SOURCE_PASS",d["station_band_counts"],d["station_vs_DEM_nonoverlap_candidate_counties"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-R3-201-station-36DEM-2847-altitude-source-only
          path: |
            research_engine/retirement/output/national_R3_station_elevations_actual_evidence.json
            research_engine/retirement/output/national_R3_201_station_36DEM_2847_missing_and_altitude.csv
          retention-days: 30
      - name: Persist independently verified elevations and remote SHA
        if: steps.audit.outcome == 'success'
        run: |
          cp research_engine/retirement/output/national_R3_station_elevations_actual_evidence.json research_engine/retirement/status/national_R3_station_elevations_actual_evidence.json
          cp research_engine/retirement/output/national_R3_201_station_36DEM_2847_missing_and_altitude.csv research_engine/retirement/status/national_R3_201_station_36DEM_2847_missing_and_altitude.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_engine/retirement/status/national_R3_station_elevations_actual_evidence.json research_engine/retirement/status/national_R3_201_station_36DEM_2847_missing_and_altitude.csv
          git commit -m "Preserve true source station height evidence for 198 mainland county candidates plus 12 previous DEM samples, 205 total"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$i" = 4 ]; then exit 1; fi
            sleep 2
          done
          git fetch origin main
          python - <<'PY'
          import hashlib,json,subprocess
          root="research_engine/retirement/status/"
          d=json.loads(subprocess.check_output(["git","show","origin/main:"+root+"national_R3_station_elevations_actual_evidence.json"]))
          b=subprocess.check_output(["git","show","origin/main:"+root+"national_R3_201_station_36DEM_2847_missing_and_altitude.csv"])
          assert hashlib.sha256(b).hexdigest()==d["national_CSV_sha256"]
          assert d["formal_valid_county_screenings"]==0
          print("R3_STATION_DEM_POSTCHECK_PASS",d["distinct_county_candidates_with_ANY_station_or_dem_R3_point_evidence"])
          PY
