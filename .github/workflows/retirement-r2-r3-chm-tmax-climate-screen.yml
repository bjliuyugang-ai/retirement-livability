name: Retirement R2 R3 CHM Tmax national climate screen
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-r2-r3-chm-tmax-climate-screen.yml'
      - 'research_engine/retirement/national_funnel/R2_R3_CLIMATE/run_chm_tmax_1991_2020.py'
  workflow_dispatch:

jobs:
  national-climate-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: retirement-r2-r3-chm-tmax-climate-screen
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore verified CHM Tmax source archive cache
        uses: actions/cache@v4
        with:
          path: work_chm_tmax_1991_2020/cache/CHM_Tmax_*.zip
          key: retirement-chm-tmax-v2-${{ github.run_id }}
          restore-keys: |
            retirement-chm-tmax-v2-
      - name: Install raster and NetCDF processing libraries
        run: python -m pip install --disable-pip-version-check numpy netCDF4 rasterio shapely
      - name: Compute 1991-2020 winter and summer climate metrics for all candidate counties
        run: python -u research_engine/retirement/national_funnel/R2_R3_CLIMATE/run_chm_tmax_1991_2020.py
      - name: Upload climate screen tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-r2-r3-chm-tmax-climate-screen
          path: research_engine/retirement/national_funnel/R2_R3_CLIMATE/output/
          retention-days: 30
          if-no-files-found: warn
      - name: Persist climate screen tables and summary
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research_engine/retirement/national_funnel/R2_R3_CLIMATE/output
          if ! git diff --cached --quiet; then
            git commit -m "Record nationwide CHM Tmax R2 R3 climate screening"
            for i in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$i" = 3 ]; then exit 1; fi
              sleep 3
            done
          fi
