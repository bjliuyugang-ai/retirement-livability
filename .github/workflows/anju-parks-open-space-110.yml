name: "Anju park and open-space POI 1km 110-area production"
on:
  push:
    branches: [anju-production-pharmacy-20261125]
    paths:
      - 'anju/scripts/parks_open_space_1km_110.py'
      - '.github/workflows/anju-parks-open-space-110.yml'
  workflow_dispatch:
jobs:
  parks-open-space-110:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY || secrets.AMAP_WEB_KEY || secrets.AMAP_KEY }}
      ANJU_MAX_REQUESTS: "350"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Query park botanical garden and city square POIs for all areas
        shell: bash
        run: |
          set -eu
          python -m py_compile anju/scripts/parks_open_space_1km_110.py
          python anju/scripts/parks_open_space_1km_110.py
      - name: Preserve park and open-space aggregate evidence
        if: success()
        shell: bash
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anju/results/parks_open_space_1km/latest.csv anju/results/parks_open_space_1km/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist 110-area park and open-space POI counts'
            git push origin HEAD:anju-production-pharmacy-20261125
          fi
      - name: Upload park and open-space evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anju-parks-open-space-1km-110-evidence
          path: |
            anju/results/parks_open_space_1km/latest.csv
            anju/results/parks_open_space_1km/latest.json
          retention-days: 30
