name: Retirement Phase1 A/B geocode focused audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-phase1-ab-geocode-audit.yml'
      - 'research_engine/retirement/phase1_236_ab_geocode_audit.py'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial dependencies
        run: python -m pip install -q --disable-pip-version-check requests shapely
      - name: One-shot A/B settlement geocode audit
        run: python -u research_engine/retirement/phase1_236_ab_geocode_audit.py
      - name: Upload auditable findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-236-ab-geocode-audit-${{ github.run_id }}
          path: |
            research_engine/retirement/status/phase1_236_ab_geocode_repair_candidates_20261110.csv
            research_engine/retirement/status/phase1_236_ab_geocode_repair_audit_20261110.json
          retention-days: 30
          if-no-files-found: warn
      - name: Persist audit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research_engine/retirement/status/phase1_236_ab_geocode_repair_candidates_20261110.csv research_engine/retirement/status/phase1_236_ab_geocode_repair_audit_20261110.json
          git commit -m "Record concentrated A/B geocode repair candidate results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
