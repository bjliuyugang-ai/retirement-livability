name: Focused island climate 30yr station comparison
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-phase1-island-climate.yml'
      - 'research_engine/retirement/phase1_island_climate_adjudication_20261110.py'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4
      - name: Verify long-term station and NASA POWER climate
        run: python -u research_engine/retirement/phase1_island_climate_adjudication_20261110.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-climate-${{ github.run_id }}
          if-no-files-found: warn
          path: research_engine/retirement/status/phase1_island_climate_1991_2020_20261110.*
      - name: Persist longterm climate audit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research_engine/retirement/status/phase1_island_climate_1991_2020_20261110.json research_engine/retirement/status/phase1_island_climate_1991_2020_20261110.csv
          git commit -m "Record observed JMA and NASA POWER thirty year island climate" || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
