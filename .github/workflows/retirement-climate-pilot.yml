name: Retirement climate data pipeline pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-climate-pilot.yml'
      - 'retirement-climate-pilot/**'
jobs:
  climate-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch real daily reanalysis and compute monthly aggregates
        run: python retirement-climate-pilot/pilot.py
      - name: Compute exploratory three-scenario point sensitivity
        run: python retirement-climate-pilot/point_sensitivity.py
      - name: Probe historical county polygons and point-in-polygon joins
        run: python retirement-climate-pilot/spatial_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirement-climate-pilot-output
          path: retirement-climate-pilot/output/
          retention-days: 14
      - name: Persist machine-readable smoke-test summary to repository
        if: always()
        run: |
          mkdir -p retirement-climate-pilot/status
          if [ -f retirement-climate-pilot/output/summary.json ]; then
            cp retirement-climate-pilot/output/summary.json retirement-climate-pilot/status/latest-summary.json
          else
            printf '{"status":"SCRIPT_DID_NOT_WRITE_SUMMARY","sites_with_12_months":0,"monthly_rows":0,"valid_county_screenings":0}\n' > retirement-climate-pilot/status/latest-summary.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f retirement-climate-pilot/output/spatial_probe.json ]; then
            cp retirement-climate-pilot/output/spatial_probe.json retirement-climate-pilot/status/latest-spatial-probe.json
          fi
          git add retirement-climate-pilot/status/latest-summary.json retirement-climate-pilot/status/latest-spatial-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record retirement climate pilot execution results"
            git push
          fi
