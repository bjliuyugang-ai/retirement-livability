name: Retirement V1.6 negative gate regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-v16-regression.yml'
jobs:
  gate-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute six negative and failure-handling regression cases
        id: tests
        continue-on-error: true
        run: |
          python retirement-climate-pilot/regression_tests.py > gate-test-output.txt 2>&1
          cat gate-test-output.txt
      - name: Save auditable regression verdict
        if: always()
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          data=pathlib.Path("gate-test-output.txt").read_text() if pathlib.Path("gate-test-output.txt").exists() else "TEST_NOT_EXECUTED"
          ok="Ran 6 tests" in data and "\nOK" in data and "FAILED" not in data and "Traceback" not in data
          out={"generated_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "run_id":os.environ.get("GITHUB_RUN_ID"),
               "tests_expected":6,"tests_passed":6 if ok else None,
               "status":"PASS" if ok else "FAIL",
               "covered":["missing_state","state_drift","missing_unique_action","unverified_writeback",
                          "completed_not_research_delta","duplicate_closed_result"],
               "log_tail":data[-7000:]}
          path=pathlib.Path("retirement-climate-pilot/status/v16-regression.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(out["status"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retirement-climate-pilot/status/v16-regression.json
          git commit -m "Record V1.6 execution gate regression test verdict"
          git push origin HEAD:main
      - name: Enforce regression outcome
        run: |
          python - <<'PY'
          import json
          d=json.load(open("retirement-climate-pilot/status/v16-regression.json"))
          assert d["status"]=="PASS",d["log_tail"]
          PY
