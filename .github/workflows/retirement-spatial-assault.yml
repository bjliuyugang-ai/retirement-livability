name: Retirement phase1 spatial assault
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-spatial-assault.yml'
jobs:
  county-spatial-assault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: retirement-phase1-spatial-state-single-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V1.6 state schema and guards
        run: python retirement-climate-pilot/assault_state.py selftest
      - name: S0-S2 precheck and claim unique action
        id: precheck
        run: python retirement-climate-pilot/assault_state.py precheck
      - name: S3 perform real historical county polygon probe
        id: spatial
        continue-on-error: true
        run: python retirement-climate-pilot/spatial_probe.py
      - name: S4-S5 judge, preserve evidence, write state and append log
        id: finalize
        if: always() && steps.precheck.outcome == 'success'
        run: python retirement-climate-pilot/assault_state.py finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-assault-evidence
          path: retirement-climate-pilot/output/
          retention-days: 14
      - name: Write auditable checkpoint
        if: steps.finalize.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_LOG.jsonl research_assets/retirement/CURRENT_STATE.md retirement-climate-pilot/status/latest-spatial-probe.json
          git diff --cached --quiet && exit 2 || true
          git commit -m "Record phase1 spatial assault evidence and pending postcheck"
          git push origin HEAD:main
      - name: S6 verify persisted results against remote then mark postcheck pass
        if: steps.finalize.outcome == 'success'
        run: |
          git fetch origin main
          python retirement-climate-pilot/assault_state.py postcheck
          git add tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_LOG.jsonl
          git commit -m "Confirm phase1 spatial assault remote postcheck"
          git push origin HEAD:main
          git fetch origin main
          python - <<'PY'
          import json,subprocess
          s=json.loads(subprocess.check_output(["git","show","origin/main:tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json"]))
          assert s["writeback_verification"]["status"]=="POSTCHECK_PASS",s
          print("REMOTE_POSTCHECK_PASS",s["last_verified_run"])
          PY
      - name: Refuse to call an unsuccessful spatial probe a success
        if: steps.spatial.outcome == 'failure'
        run: exit 1
