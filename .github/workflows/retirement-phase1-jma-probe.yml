name: Probe JMA 59981 all-years term mode
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-phase1-jma-probe.yml'
      - 'research_engine/retirement/phase1_jma_59981_terms_20261110.py'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests beautifulsoup4
      - run: python -u research_engine/retirement/phase1_jma_59981_terms_20261110.py
      - if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_engine/retirement/status/phase1_jma_59981_term_mode_probe_20261110.json
          git commit -m "Record JMA 59981 term mode probe" || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
