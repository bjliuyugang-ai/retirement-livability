name: Retirement 132 short-history CN stations actual R2 rain and sunshine source audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retirement-cn132-interim-r2-actual.yml'
jobs:
  real-132-rain-sun-observation-source:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    concurrency:
      group: retirement-phase1-state-single-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gate V1.6 S0-S2 one R2 source action
        run: |
          python - <<'PY'
          import json,subprocess
          s=json.load(open("tasks/6aead9a989808191ad42f80fd4e32bf1/phase1/RUN_STATE.json"))
          assert s["state_revision"]==53
          assert s["active_action"]["action_id"]=="RET-CASCADE-NATIONAL-R2-INTERIM-008"
          assert s["writeback_verification"]["status"]=="POSTCHECK_PASS"
          assert s["current_state_ref"]["git_blob_sha"]==subprocess.check_output(["git","hash-object","research_assets/retirement/CURRENT_STATE.md"],text=True).strip()
          print("CN132_R2_INTERIM_ACTIVE_GATED",s["state_revision"])
          PY
      - uses: actions/cache@v4
        with:
          path: research_engine/retirement/output/meteostat_bulk_runtime
          key: meteostat-station-monthly-2026-11-07-source-snapshot
      - name: Actually read original source Parquet for 132 short-history stations
        run: |
          python -m pip -q install duckdb
          python -m py_compile research_engine/retirement/meteostat_CN132_interim_R2_obs.py
          python -u research_engine/retirement/meteostat_CN132_interim_R2_obs.py
      - name: Check distinct 30yr versus 15yr tier, all 2847, withheld formal grades
        id: audit
        run: |
          python - <<'PY'
          import csv,hashlib,json
          b="research_engine/retirement/output/"
          d=json.load(open(b+"meteostat_CN132_interim_R2_evidence.json"))
          assert d["interim_station_geographic_accepted"]==132
          assert d["prior_R2_longer_source_partials_retained"]==73
          assert d["R1_all_partial_any_period_retained"]==214
          assert d["new_interim_only_R2_counties"]>=1
          assert d["R2_total_counties_any_partial_evidence_including_interim"]==73+d["new_interim_only_R2_counties"]
          assert d["R2_never_scanned_or_without_any_observation"]==2847-d["R2_total_counties_any_partial_evidence_including_interim"]
          assert d["formal_valid_county_screenings"]==0 and d["confirmed_exclusions"]==0
          assert d["interim_not_full_1991_2020_climate_normal"] is True
          for x,y in [("national_R2_132_interim_obs_source_2847.csv","national_output_csv_sha256"),("meteostat_CN132_interim_R2_parameter_source.csv","station_source_csv_sha256")]:
            assert hashlib.sha256(open(b+x,"rb").read()).hexdigest()==d[y]
          rows=list(csv.DictReader(open(b+"national_R2_132_interim_obs_source_2847.csv",encoding="utf-8-sig")))
          assert len(rows)==2847
          assert sum(z["R2_status"]!="NOT_SCREENED" for z in rows)==d["R2_total_counties_any_partial_evidence_including_interim"]
          assert all(z["confirmed_exit_round"]=="" for z in rows)
          print("R2_CN132_INTERIM_ACTUAL_OBSERVATIONS_PASS",d["new_interim_only_R2_counties"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CN132-real-1991-2020-short-history-rain-sun-not-full-climate-normal
          path: |
            research_engine/retirement/output/meteostat_CN132_interim_R2_evidence.json
            research_engine/retirement/output/national_R2_132_interim_obs_source_2847.csv
            research_engine/retirement/output/meteostat_CN132_interim_R2_parameter_source.csv
          retention-days: 30
      - name: Persist actual source observations and verify immutable remote hashes
        if: steps.audit.outcome == 'success'
        run: |
          cp research_engine/retirement/output/meteostat_CN132_interim_R2_evidence.json research_engine/retirement/status/meteostat_CN132_interim_R2_evidence.json
          cp research_engine/retirement/output/national_R2_132_interim_obs_source_2847.csv research_engine/retirement/status/national_R2_132_interim_obs_source_2847.csv
          cp research_engine/retirement/output/meteostat_CN132_interim_R2_parameter_source.csv research_engine/retirement/status/meteostat_CN132_interim_R2_parameter_source.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_engine/retirement/status/meteostat_CN132_interim_R2_evidence.json research_engine/retirement/status/national_R2_132_interim_obs_source_2847.csv research_engine/retirement/status/meteostat_CN132_interim_R2_parameter_source.csv
          git commit -m "Preserve independent actual rain and sunshine provenance for 132 Chinese interim climate stations and 2847-candidate R2 ledger"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$i" = 4 ]; then exit 1; fi
            sleep 2
          done
          git fetch origin main
          python - <<'PY'
          import hashlib,json,subprocess
          root="research_engine/retirement/status/"
          d=json.loads(subprocess.check_output(["git","show","origin/main:"+root+"meteostat_CN132_interim_R2_evidence.json"]))
          for k,v in [("national_R2_132_interim_obs_source_2847.csv","national_output_csv_sha256"),("meteostat_CN132_interim_R2_parameter_source.csv","station_source_csv_sha256")]:
            raw=subprocess.check_output(["git","show","origin/main:"+root+k])
            assert hashlib.sha256(raw).hexdigest()==d[v]
          assert d["prior_R2_longer_source_partials_retained"]==73
          assert d["formal_valid_county_screenings"]==0
          print("CN132_R2_INTERIM_SOURCE_REMOTE_SHA_PASS",d["new_interim_only_R2_counties"])
          PY
