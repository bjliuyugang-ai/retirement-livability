name: "Anju scenic-spot POI 1km 110-area production"
on:
  push:
    branches: [anju-production-pharmacy-20261125]
    paths:
      - 'anju/scripts/scenic_spots_1km_110.py'
  workflow_dispatch:
concurrency:
  group: anju-scenic-spots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scenic-spots-110:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY || secrets.AMAP_WEB_KEY || secrets.AMAP_KEY }}
      ANJU_MAX_REQUESTS: "130"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Query scenic-spot POIs for all areas
        shell: bash
        run: |
          set -eu
          python -m py_compile anju/scripts/scenic_spots_1km_110.py
          python anju/scripts/scenic_spots_1km_110.py
      - name: Upload scenic-spot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anju-scenic-spots-1km-110-evidence
          path: |
            anju/results/scenic_spots_1km/latest.csv
            anju/results/scenic_spots_1km/latest.json
          retention-days: 30
